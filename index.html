<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture Volume Control</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div class="container">

    <h1>Hand Gesture Volume Control</h1>

    <p class="description">
      Control the volume indicator using your hand gestures.
    </p>

    <button id="startButton">
      Start Camera
    </button>

    <span id="status">
      Camera not started
    </span>

    <div class="camera-container">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <canvas id="canvas"></canvas>

    </div>

    <div class="panel">

      <div class="volume">
        Volume:
        <span id="volumeValue">0</span>%
      </div>

      <div class="volume-bar">
        <div id="volume-fill"></div>
      </div>

      <div class="distances">

        <div class="distance-box">
          Thumb-Index
          <strong id="indexValue">--</strong>
        </div>

        <div class="distance-box">
          Thumb-Middle
          <strong id="middleValue">--</strong>
        </div>

        <div class="distance-box">
          Thumb-Ring
          <strong id="ringValue">--</strong>
        </div>

        <div class="distance-box">
          Thumb-Pinky
          <strong id="pinkyValue">--</strong>
        </div>

      </div>

      <p class="note">
        Thumb-to-Pinky distance controls the volume indicator.
      </p>

    </div>

    <div class="footer">
      Hand landmark processing runs directly in your browser.
    </div>

  </div>

  <script src="./app.js"></script>

</body>
</html>
